name: Unified Release

on:
  workflow_dispatch:
    inputs:
      main_ref:
        description: wait-monitor branch, tag, or SHA to release
        required: true
        default: main
      agent_ref:
        description: wait-agent branch, tag, or SHA to release
        required: true
        default: main
      web_ref:
        description: Frontend branch, tag, or SHA to embed
        required: true
        default: main
      publish_releases:
        description: Create GitHub Releases. Disable for dry-run.
        required: true
        type: boolean
        default: true
      reuse_release_versions:
        description: Reuse all latest versions (requires deliberate clobber when publishing).
        required: true
        type: boolean
        default: false
      allow_release_clobber:
        description: Allow uploading over existing release assets.
        required: true
        type: boolean
        default: false
      main_version:
        description: Optional explicit main version, for example v0.1.35
        required: false
        default: ""
      agent_version:
        description: Optional explicit agent version, for example v0.1.26
        required: false
        default: ""
      force_agent_release:
        description: Publish Agent even when its source commit has not changed.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Build, sign, and publish releases
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ROOT_DIR: ${{ github.workspace }}
      OUT_DIR: ${{ github.workspace }}/release-output
      WAIT_RELEASE_SIGNING_KEY: ${{ inputs.publish_releases && format('{0}/.release-secrets/.wait-release-signing-key.pem', github.workspace) || '' }}
      PUBLISH_RELEASES: ${{ inputs.publish_releases && '1' || '0' }}
      REUSE_RELEASE_VERSIONS: ${{ inputs.reuse_release_versions && '1' || '0' }}
      ALLOW_RELEASE_CLOBBER: ${{ inputs.allow_release_clobber && '1' || '0' }}
      FORCE_AGENT_RELEASE: ${{ inputs.force_agent_release && '1' || '0' }}

    steps:
      - name: Validate inputs and checkout secret
        env:
          MAIN_REF: ${{ inputs.main_ref }}
          AGENT_REF: ${{ inputs.agent_ref }}
          WEB_REF: ${{ inputs.web_ref }}
          MAIN_VERSION_INPUT: ${{ inputs.main_version }}
          AGENT_VERSION_INPUT: ${{ inputs.agent_version }}
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          validate_ref() {
            local label="$1"
            local value="$2"
            if [[ "${value}" != "main" && ! "${value}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && ! "${value}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "${label} must be main, an exact semver tag, or a full 40-character commit SHA" >&2
              exit 1
            fi
          }
          validate_version() {
            local label="$1"
            local value="$2"
            if [[ -n "${value}" && ! "${value}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "${label} must be empty or an exact semantic version such as v1.2.3" >&2
              exit 1
            fi
          }
          validate_ref MAIN_REF "${MAIN_REF}"
          validate_ref AGENT_REF "${AGENT_REF}"
          validate_ref WEB_REF "${WEB_REF}"
          validate_version MAIN_VERSION_INPUT "${MAIN_VERSION_INPUT}"
          validate_version AGENT_VERSION_INPUT "${AGENT_VERSION_INPUT}"
          if [ "${REUSE_RELEASE_VERSIONS}" = "1" ] && [ "${ALLOW_RELEASE_CLOBBER}" != "1" ]; then
            echo "reuse_release_versions requires allow_release_clobber because existing releases will be replaced" >&2
            exit 1
          fi
          if [ -z "${RELEASE_GITHUB_TOKEN}" ]; then
            echo "Missing secret RELEASE_GITHUB_TOKEN" >&2
            exit 1
          fi

      - name: Validate release signing secret
        if: inputs.publish_releases
        env:
          WAIT_RELEASE_SIGNING_KEY_PEM: ${{ secrets.WAIT_RELEASE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          if [ -z "${WAIT_RELEASE_SIGNING_KEY_PEM}" ]; then
            echo "Missing secret WAIT_RELEASE_SIGNING_KEY_PEM" >&2
            exit 1
          fi

      - name: Checkout release orchestration
        uses: actions/checkout@v6
        with:
          path: wait-release
          persist-credentials: false

      - name: Checkout wait-monitor
        uses: actions/checkout@v6
        with:
          repository: nimeng1222/wait-monitor
          ref: ${{ inputs.main_ref }}
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          path: wait-main
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout wait-agent
        uses: actions/checkout@v6
        with:
          repository: nimeng1222/wait-agent
          ref: ${{ inputs.agent_ref }}
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          path: wait-agent-main
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout frontend
        uses: actions/checkout@v6
        with:
          repository: nimeng1222/wait-web-next
          ref: ${{ inputs.web_ref }}
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          path: wait-web-next
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release versions
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          MAIN_VERSION_INPUT: ${{ inputs.main_version }}
          AGENT_VERSION_INPUT: ${{ inputs.agent_version }}
        run: |
          set -euo pipefail
          latest_version() {
            local repo="$1"
            local tags
            if ! tags="$(gh api --paginate "repos/${repo}/tags?per_page=100" --jq '.[].name')"; then
              echo "Failed to list tags for ${repo}" >&2
              return 1
            fi
            printf '%s\n' "${tags}" \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1 \
              | sed 's/^v//' || true
          }
          main_current_version="$(latest_version nimeng1222/wait-monitor)"
          agent_current_version="$(latest_version nimeng1222/wait-agent)"
          printf 'CURRENT_MAIN_VERSION=%s\n' "${main_current_version}" >> "${GITHUB_ENV}"
          printf 'CURRENT_AGENT_VERSION=%s\n' "${agent_current_version}" >> "${GITHUB_ENV}"
          if [ -n "${MAIN_VERSION_INPUT}" ]; then
            printf 'MAIN_VERSION=%s\n' "${MAIN_VERSION_INPUT}" >> "${GITHUB_ENV}"
          fi
          if [ -n "${AGENT_VERSION_INPUT}" ]; then
            printf 'AGENT_VERSION=%s\n' "${AGENT_VERSION_INPUT}" >> "${GITHUB_ENV}"
          fi

      - name: Preview release plan
        env:
          MAIN_VERSION_INPUT: ${{ inputs.main_version }}
          AGENT_VERSION_INPUT: ${{ inputs.agent_version }}
        run: |
          set -euo pipefail
          agent_commit="$(git -C wait-agent-main rev-parse HEAD)"
          current_agent_commit="$(git -C wait-agent-main rev-list -n 1 "v${CURRENT_AGENT_VERSION}")"
          # shellcheck source=release-version-plan.sh
          source wait-release/release-version-plan.sh
          resolve_release_version_plan \
            "${CURRENT_MAIN_VERSION}" \
            "${CURRENT_AGENT_VERSION}" \
            "${agent_commit}" \
            "${current_agent_commit}" \
            "${REUSE_RELEASE_VERSIONS}" \
            "${MAIN_VERSION_INPUT}" \
            "${AGENT_VERSION_INPUT}" \
            "${FORCE_AGENT_RELEASE}"
          {
            echo "## Release plan"
            echo ""
            echo "| Component | Current | Planned | Reason | Publish dedicated release |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| wait-main + web | v${CURRENT_MAIN_VERSION} | ${MAIN_VERSION} | ${MAIN_VERSION_REASON} | yes |"
            echo "| wait-agent | v${CURRENT_AGENT_VERSION} | ${AGENT_VERSION} | ${AGENT_VERSION_REASON} | $([ "${AGENT_RELEASE_REQUIRED}" = "1" ] && echo yes || echo no) |"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            wait-main/go.sum
            wait-agent-main/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: wait-web-next/package-lock.json

      - name: Install Zig cross-compiler toolchain
        run: |
          set -euo pipefail
          ZIG_VERSION="0.14.1"
          ZIG_TARBALL="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"

          # 供应链信任（review H1）：原实现从 PyPI 拉 ziglang 包且无完整性校验，
          # 改为官方 tarball + minisign 固定公钥校验，与 build.yml 保持一致。
          # 签名只证明"由本脚本产出"，工具链自身可信度必须从源头绑定。
          sudo apt-get update
          sudo apt-get install -y build-essential curl minisign xz-utils
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSLO "https://ziglang.org/download/${ZIG_VERSION}/${ZIG_TARBALL}"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSLO "https://ziglang.org/download/${ZIG_VERSION}/${ZIG_TARBALL}.minisig"
          minisign -Vm "${ZIG_TARBALL}" -P "RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U"
          sudo tar -C /usr/local -Jxf "${ZIG_TARBALL}"
          printf '%s\n' "/usr/local/zig-x86_64-linux-${ZIG_VERSION}" >> "${GITHUB_PATH}"
          "/usr/local/zig-x86_64-linux-${ZIG_VERSION}/zig" version

      - name: Test and build without release secrets
        run: |
          set -euo pipefail
          (cd wait-main && go vet ./... && go test ./...)
          (cd wait-agent-main && go vet ./... && go test ./...)
          npm ci --prefix wait-web-next
          npm run lint --prefix wait-web-next
          npm run test:unit --prefix wait-web-next
          npm run build --prefix wait-web-next

      - name: Prepare release signing key
        if: inputs.publish_releases
        env:
          WAIT_RELEASE_SIGNING_KEY_PEM: ${{ secrets.WAIT_RELEASE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          # 密钥改写到 .release-secrets/（被根 .gitignore 覆盖）+ 受 umask 077 保护，
          # 配合末尾的 cleanup 步骤避免 runner 复用导致密钥泄漏。
          mkdir -p "${GITHUB_WORKSPACE}/.release-secrets"
          chmod 700 "${GITHUB_WORKSPACE}/.release-secrets"
          umask 077
          printf '%s\n' "${WAIT_RELEASE_SIGNING_KEY_PEM}" > "${WAIT_RELEASE_SIGNING_KEY}"
          openssl pkey -in "${WAIT_RELEASE_SIGNING_KEY}" -noout

      - name: Build, sign, and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          SKIP_QUALITY_GATE: "1"
          SKIP_WEB_BUILD: "1"
          SKIP_REMOTE_COMMIT_CHECK: "1"
        run: |
          set -euo pipefail
          bash wait-release/release-unified.sh

      - name: Debug release-output paths
        if: always()
        run: |
          set -euo pipefail
          echo "workspace: ${GITHUB_WORKSPACE}"
          ls -la "${GITHUB_WORKSPACE}" || true
          ls -la "${GITHUB_WORKSPACE}/release-output" || true
          ls -la "${GITHUB_WORKSPACE}/wait-release/release-output" || true

      - name: Verify generated signatures
        run: |
          set -euo pipefail
          openssl dgst -sha256 -verify release-output/RELEASE_PUBKEY.pem -signature release-output/SHA256SUMS.txt.sig release-output/SHA256SUMS.txt
          openssl dgst -sha256 -verify release-output/RELEASE_PUBKEY.pem -signature release-output/wait-main/wait-linux-amd64.sig release-output/wait-main/wait-linux-amd64
          openssl dgst -sha256 -verify release-output/RELEASE_PUBKEY.pem -signature release-output/wait-agent/wait-agent-linux-amd64.sig release-output/wait-agent/wait-agent-linux-amd64
          if grep -n '\.sig' release-output/SHA256SUMS.txt; then
            echo "SHA256SUMS.txt must not include .sig files" >&2
            exit 1
          fi

      - name: Upload release-output artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-output
          path: |
            ${{ github.workspace }}/release-output
            ${{ github.workspace }}/wait-release/release-output
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup signing key
        if: always() && inputs.publish_releases
        run: |
          set -euo pipefail
          # review M3：密钥物化到 runner 文件系统后必须擦除，避免 runner 复用泄漏。
          # 用 if: always() 保证即使前面步骤失败也会执行。
          rm -f "${WAIT_RELEASE_SIGNING_KEY}"
          rmdir "${GITHUB_WORKSPACE}/.release-secrets" 2>/dev/null || true
