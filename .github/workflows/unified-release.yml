name: Unified Release

on:
  workflow_dispatch:
    inputs:
      main_ref:
        description: wait-monitor branch, tag, or full SHA to release
        required: true
        default: main
      agent_ref:
        description: wait-agent branch, tag, or full SHA to release
        required: true
        default: main
      web_ref:
        description: Frontend branch, tag, or full SHA to embed
        required: true
        default: main
      publish_releases:
        description: Create GitHub Releases. Disable for signed dry-run artifact only.
        required: true
        type: boolean
        default: true
      main_version:
        description: Optional explicit main version, for example v0.1.35
        required: false
        default: ""
      agent_version:
        description: Optional explicit agent version, for example v0.1.26
        required: false
        default: ""
      force_agent_release:
        description: Publish Agent even when its source commit has not changed.
        required: true
        type: boolean
        default: false

concurrency:
  group: unified-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Test and build unsigned release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ROOT_DIR: ${{ github.workspace }}
      OUT_DIR: ${{ github.workspace }}/release-output
      PUBLISH_RELEASES: "0"
      RELEASE_BUILD_ONLY: "1"
      SKIP_REMOTE_COMMIT_CHECK: "1"
      REUSE_RELEASE_VERSIONS: "0"
      ALLOW_RELEASE_CLOBBER: "0"
      FORCE_AGENT_RELEASE: ${{ inputs.force_agent_release && '1' || '0' }}
      MAIN_VERSION: ${{ inputs.main_version }}
      AGENT_VERSION: ${{ inputs.agent_version }}

    steps:
      - name: Validate inputs
        env:
          MAIN_REF: ${{ inputs.main_ref }}
          AGENT_REF: ${{ inputs.agent_ref }}
          WEB_REF: ${{ inputs.web_ref }}
          MAIN_VERSION_INPUT: ${{ inputs.main_version }}
          AGENT_VERSION_INPUT: ${{ inputs.agent_version }}
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          validate_ref() {
            local label="$1" value="$2"
            if [[ "${value}" != "main" && ! "${value}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && ! "${value}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "${label} must be main, an exact semver tag, or a full 40-character commit SHA" >&2
              exit 1
            fi
          }
          validate_version() {
            local label="$1" value="$2"
            if [ -n "${value}" ] && [[ ! "${value}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "${label} must be empty or an exact semantic version such as v1.2.3" >&2
              exit 1
            fi
          }
          validate_ref MAIN_REF "${MAIN_REF}"
          validate_ref AGENT_REF "${AGENT_REF}"
          validate_ref WEB_REF "${WEB_REF}"
          validate_version MAIN_VERSION_INPUT "${MAIN_VERSION_INPUT}"
          validate_version AGENT_VERSION_INPUT "${AGENT_VERSION_INPUT}"
          if [ -z "${RELEASE_GITHUB_TOKEN}" ]; then
            echo "Missing secret RELEASE_GITHUB_TOKEN" >&2
            exit 1
          fi
          if [ "${{ inputs.publish_releases }}" = "true" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Publishing is allowed only when this workflow runs from wait-release/main" >&2
            exit 1
          fi

      - name: Checkout release orchestration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: wait-release
          persist-credentials: false

      - name: Checkout wait-monitor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: nimeng1222/wait-monitor
          ref: ${{ inputs.main_ref }}
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          path: wait-main
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout wait-agent
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: nimeng1222/wait-agent
          ref: ${{ inputs.agent_ref }}
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          path: wait-agent-main
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout frontend
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: nimeng1222/wait-web-next
          ref: ${{ inputs.web_ref }}
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          path: wait-web-next
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Agent release target contract
        run: bash wait-agent-main/scripts/verify-release-targets.sh --release-dir wait-release

      - name: Require protected CI for selected commits
        if: inputs.publish_releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          require_test_check() {
            local repo="$1" checkout_dir="$2" sha
            sha="$(git -C "${checkout_dir}" rev-parse HEAD)"
            local passed
            passed="$(gh api "repos/${repo}/commits/${sha}/check-runs" --jq '[.check_runs[] | select(.name == "test" and .status == "completed" and .conclusion == "success")] | length')"
            if [ "${passed}" -lt 1 ]; then
              echo "${repo}@${sha} has no successful protected test check-run" >&2
              exit 1
            fi
          }
          require_test_check nimeng1222/wait-monitor wait-main
          require_test_check nimeng1222/wait-agent wait-agent-main
          require_test_check nimeng1222/wait-web-next wait-web-next

      - name: Resolve release versions
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          MAIN_VERSION_INPUT: ${{ inputs.main_version }}
          AGENT_VERSION_INPUT: ${{ inputs.agent_version }}
        run: |
          set -euo pipefail
          latest_version() {
            local repo="$1" tags
            tags="$(gh api --paginate "repos/${repo}/tags?per_page=100" --jq '.[].name')"
            printf '%s\n' "${tags}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 | sed 's/^v//' || true
          }
          printf 'CURRENT_MAIN_VERSION=%s\n' "$(latest_version nimeng1222/wait-monitor)" >> "${GITHUB_ENV}"
          printf 'CURRENT_AGENT_VERSION=%s\n' "$(latest_version nimeng1222/wait-agent)" >> "${GITHUB_ENV}"

      - name: Resolve and validate release plan
        run: |
          set -euo pipefail
          agent_commit="$(git -C wait-agent-main rev-parse HEAD)"
          current_agent_commit="$(git -C wait-agent-main rev-list -n 1 "v${CURRENT_AGENT_VERSION}")"
          source wait-release/release-version-plan.sh
          resolve_release_version_plan \
            "${CURRENT_MAIN_VERSION}" \
            "${CURRENT_AGENT_VERSION}" \
            "${agent_commit}" \
            "${current_agent_commit}" \
            "0" \
            "${MAIN_VERSION}" \
            "${AGENT_VERSION}" \
            "${FORCE_AGENT_RELEASE}"
          greater_than_current() {
            local planned="$1" current="$2"
            [ "${planned}" != "v${current}" ] && [ "$(printf '%s\n' "v${current}" "${planned}" | sort -V | tail -n 1)" = "${planned}" ]
          }
          if ! greater_than_current "${MAIN_VERSION}" "${CURRENT_MAIN_VERSION}"; then
            echo "main version ${MAIN_VERSION} must be greater than current v${CURRENT_MAIN_VERSION}" >&2
            exit 1
          fi
          if [ "${AGENT_RELEASE_REQUIRED}" = "1" ] && ! greater_than_current "${AGENT_VERSION}" "${CURRENT_AGENT_VERSION}"; then
            echo "agent version ${AGENT_VERSION} must be greater than current v${CURRENT_AGENT_VERSION}" >&2
            exit 1
          fi
          {
            echo "MAIN_VERSION=${MAIN_VERSION}"
            echo "AGENT_VERSION=${AGENT_VERSION}"
            echo "CURRENT_AGENT_COMMIT=${current_agent_commit}"
          } >> "${GITHUB_ENV}"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: |
            wait-main/go.sum
            wait-agent-main/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: wait-web-next/package-lock.json

      - name: Install Zig cross-compiler toolchain
        run: |
          set -euo pipefail
          ZIG_VERSION="0.14.1"
          ZIG_TARBALL="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sudo apt-get update
          sudo apt-get install -y build-essential curl minisign xz-utils
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSLO "https://ziglang.org/download/${ZIG_VERSION}/${ZIG_TARBALL}"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSLO "https://ziglang.org/download/${ZIG_VERSION}/${ZIG_TARBALL}.minisig"
          minisign -Vm "${ZIG_TARBALL}" -P "RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U"
          sudo tar -C /usr/local -Jxf "${ZIG_TARBALL}"
          printf '%s\n' "/usr/local/zig-x86_64-linux-${ZIG_VERSION}" >> "${GITHUB_PATH}"

      - name: Test selected sources and build frontend
        run: |
          set -euo pipefail
          # review-2026-08-17 P2-32: first install, upgrade, credential rotation, and rollback.
          bash wait-release/tests/install-agent-smoke.sh
          (cd wait-main && go test -race ./... && go vet ./... && go install golang.org/x/vuln/cmd/govulncheck@v1.6.0 && "$(go env GOPATH)/bin/govulncheck" ./...)
          (cd wait-agent-main && go test -race ./... && go vet ./... && go install golang.org/x/vuln/cmd/govulncheck@v1.6.0 && "$(go env GOPATH)/bin/govulncheck" ./...)
          npm ci --prefix wait-web-next
          # review-2026-08-17 P2-2: gate both dependency trees and browser workflows before build/sign.
          npm audit --omit=dev --audit-level=high --prefix wait-web-next
          npm audit --audit-level=moderate --prefix wait-web-next
          npm run lint --prefix wait-web-next
          npm run test:unit --prefix wait-web-next
          npm run build --prefix wait-web-next
          npx --prefix wait-web-next playwright install --with-deps chromium
          npm run test:e2e --prefix wait-web-next

      - name: Build unsigned artifact
        env:
          SKIP_QUALITY_GATE: "1"
          SKIP_WEB_BUILD: "1"
        run: |
          set -euo pipefail
          bash wait-release/release-unified.sh
          if [ -e release-output/RELEASE_PUBKEY.pem ] || find release-output -name '*.sig' -print -quit | grep -q .; then
            echo "unsigned build unexpectedly contains signing material" >&2
            exit 1
          fi
          (cd release-output && sha256sum -c SHA256SUMS.txt)

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: unsigned-release-output
          path: ${{ github.workspace }}/release-output
          retention-days: 14

  sign:
    name: Isolated release signing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download unsigned artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: unsigned-release-output
          path: release-output

      - name: Sign artifact without checkout or source execution
        env:
          PUBLISH_RELEASES: ${{ inputs.publish_releases && '1' || '0' }}
          WAIT_RELEASE_SIGNING_KEY_PEM: ${{ inputs.publish_releases && secrets.WAIT_RELEASE_SIGNING_KEY_PEM || '' }}
        run: |
          set -euo pipefail
          out_dir="$PWD/release-output"
          key_path="${RUNNER_TEMP}/wait-release-signing-key.pem"
          cleanup() { rm -f "${key_path}"; }
          trap cleanup EXIT
          if find "${out_dir}" -type l -print -quit | grep -q .; then
            echo "Unsigned artifact must not contain symbolic links" >&2
            exit 1
          fi
          while IFS= read -r -d '' file_path; do
            relative="${file_path#"${out_dir}"/}"
            if [[ ! "${relative}" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "${relative}" == *".."* ]]; then
              echo "Unsigned artifact contains an unsafe path: ${relative}" >&2
              exit 1
            fi
          done < <(find "${out_dir}" -type f -print0)
          umask 077
          if [ "${PUBLISH_RELEASES}" = "1" ]; then
            if [ -z "${WAIT_RELEASE_SIGNING_KEY_PEM}" ]; then
              echo "Missing secret WAIT_RELEASE_SIGNING_KEY_PEM" >&2
              exit 1
            fi
            printf '%s\n' "${WAIT_RELEASE_SIGNING_KEY_PEM}" > "${key_path}"
          else
            openssl ecparam -name prime256v1 -genkey -noout -out "${key_path}"
          fi
          openssl pkey -in "${key_path}" -pubout -out "${out_dir}/RELEASE_PUBKEY.pem"
          pubkey_hash="$(openssl pkey -pubin -in "${out_dir}/RELEASE_PUBKEY.pem" -outform DER | sha256sum | awk '{print $1}')"
          if [ "${PUBLISH_RELEASES}" = "1" ] && [ "${pubkey_hash}" != "fd23f7753c6f9865adaeed9178ed222fbf1f6e173d89334783dcacb4915c3166" ]; then
            echo "Signing key does not match the pinned release trust root" >&2
            exit 1
          fi
          find "${out_dir}" -type f -name '*.sig' -delete
          sed -i.bak 's/release signing mode: unsigned-build/release signing mode: isolated-release-signing/' "${out_dir}/MANIFEST.txt"
          rm -f "${out_dir}/MANIFEST.txt.bak"
          rm -f "${out_dir}/SHA256SUMS.txt"
          checksum_inputs=()
          while IFS= read -r file_path; do
            checksum_inputs+=("${file_path}")
          done < <(find "${out_dir}" -type f ! -name 'SHA256SUMS.txt' ! -name '*.sig' -print | LC_ALL=C sort)
          (
            cd "${out_dir}"
            : > SHA256SUMS.txt
            for file_path in "${checksum_inputs[@]}"; do
              relative="${file_path#"${out_dir}"/}"
              printf '%s  %s\n' "$(sha256sum "${file_path}" | awk '{print $1}')" "${relative}" >> SHA256SUMS.txt
            done
          )
          signature_targets=(
            "${out_dir}/wait-main/wait-linux-amd64"
            "${out_dir}/wait-main/wait-linux-arm64"
            "${out_dir}/install-wait.sh"
            "${out_dir}/install-agent.sh"
            "${out_dir}/wait-agent-update.json"
            "${out_dir}/wait-agent-targets.tsv"
            "${out_dir}/SHA256SUMS.txt"
          )
          target_count=0
          declare -A target_keys=()
          declare -A target_filenames=()
          IFS= read -r target_header < "${out_dir}/wait-agent-targets.tsv"
          if [ "${target_header}" != $'schema\tos\tarch\tfilename\tci\tpublish\tinstaller\tself_update' ]; then
            echo "Invalid Agent target manifest header" >&2
            exit 1
          fi
          while IFS=$'\t' read -r schema goos goarch filename ci publish installer self_update; do
            if [ "${schema}" != "wait-agent-targets/v1" ] ||
               [[ ! "${goos}" =~ ^[a-z0-9]+$ ]] ||
               [[ ! "${goarch}" =~ ^[a-z0-9]+$ ]] ||
               [[ ! "${filename}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid Agent target row: ${goos}/${goarch} ${filename}" >&2
              exit 1
            fi
            if { [ "${ci}" != "true" ] && [ "${ci}" != "false" ]; } ||
               { [ "${publish}" != "true" ] && [ "${publish}" != "false" ]; } ||
               { [ "${self_update}" != "true" ] && [ "${self_update}" != "false" ]; } ||
               { [ "${installer}" != "none" ] && [ "${installer}" != "systemd" ] && [ "${installer}" != "windows-nssm" ]; }; then
              echo "Invalid Agent target flags: ${goos}/${goarch}" >&2
              exit 1
            fi
            target_key="${goos}/${goarch}"
            if [[ -n "${target_keys[$target_key]:-}" ]] || [[ -n "${target_filenames[$filename]:-}" ]]; then
              echo "Duplicate Agent target or filename: ${target_key} ${filename}" >&2
              exit 1
            fi
            target_keys["${target_key}"]=1
            target_filenames["${filename}"]=1
            if [ "${publish}" = "true" ]; then
              if [ "${ci}" != "true" ] || [ "${self_update}" != "true" ] || [ "${installer}" = "none" ]; then
                echo "Published Agent target lacks ci/installer/self_update: ${target_key}" >&2
                exit 1
              fi
              signature_targets+=("${out_dir}/wait-agent/${filename}")
              target_count=$((target_count + 1))
            fi
          done < <(tail -n +2 "${out_dir}/wait-agent-targets.tsv")
          if [ "${target_count}" -eq 0 ]; then
            echo "Agent target manifest contains no published targets" >&2
            exit 1
          fi
          for file_path in "${signature_targets[@]}"; do
            if [ ! -f "${file_path}" ]; then
              echo "Missing signature target: ${file_path}" >&2
              exit 1
            fi
            openssl dgst -sha256 -sign "${key_path}" -out "${file_path}.sig" "${file_path}"
          done
          (
            cd "${out_dir}"
            sha256sum -c SHA256SUMS.txt
            openssl dgst -sha256 -verify RELEASE_PUBKEY.pem -signature SHA256SUMS.txt.sig SHA256SUMS.txt
          )

      - name: Upload signed artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: signed-release-output
          path: ${{ github.workspace }}/release-output
          retention-days: 14

  publish:
    name: Verify and publish release drafts
    if: inputs.publish_releases
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout release publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: wait-release
          persist-credentials: false

      - name: Download signed artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: signed-release-output
          path: release-output

      - name: Verify and publish immutable release closure
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          OUT_DIR: ${{ github.workspace }}/release-output
        run: bash wait-release/publish-release-output.sh
